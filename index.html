<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El equipo de Peter Pan</title><style>
:root{font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff8dc;background:#071a37}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#3b568b 0,transparent 30%),linear-gradient(#09142c,#153c54 80%,#0e403a);overflow-x:hidden}body:before{content:'✦   ·    ✧      ✦      ·       ✧      ✦     ·      ✦';position:fixed;top:5%;left:3%;width:95%;font-size:28px;letter-spacing:24px;color:#ffe6a4;opacity:.5;pointer-events:none;animation:twinkle 4s infinite alternate}@keyframes twinkle{to{opacity:.13;transform:translateY(7px)}}.app{max-width:960px;margin:0 auto;padding:18px 15px 48px;position:relative}.panel{background:linear-gradient(145deg,#183658ee,#102542f2);border:2px solid #d5ad60;border-radius:22px;padding:22px;box-shadow:0 12px 35px #0008;text-align:center}.hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px}.scene{font-size:clamp(42px,10vw,100px);filter:drop-shadow(0 8px 5px #0005)}h1{font-size:clamp(32px,6vw,62px);color:#ffdf89;margin:0;text-shadow:0 4px 0 #6e3f2a}h2{font-size:clamp(25px,4vw,38px);color:#ffdd8e;margin:8px 0 14px}p{line-height:1.5}button{border:0;border-radius:15px;background:#f5c45c;color:#17283d;font-size:17px;font-weight:800;padding:13px 18px;cursor:pointer;box-shadow:0 4px 0 #9e7135;touch-action:manipulation}button:hover{filter:brightness(1.1)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #9e7135}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#b9e2dd;box-shadow:0 4px 0 #547e80}button.danger{background:#ffc0a6}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}.hearts{font-size:26px;letter-spacing:3px}.progress{font-size:14px;color:#e8d6aa}.board{display:grid;gap:3px;width:min(100%,480px);margin:14px auto;aspect-ratio:1;background:#061527;border:5px solid #b88e52;border-radius:12px;padding:4px}.cell{min-width:0;min-height:0;display:grid;place-items:center;font-size:clamp(15px,3.6vw,32px);border-radius:4px;background:#326e75;position:relative}.cell.wall{background:repeating-linear-gradient(45deg,#76513a,#76513a 8px,#956e49 8px,#956e49 16px)}.cell.goal{background:#8d7742}.cell.path{background:#426b82}.cell.player{background:#e8bd65;color:#14263a}.cell.coin{background:#3b8a78}.controls{display:grid;grid-template-columns:repeat(3,65px);justify-content:center;gap:7px;margin:15px auto}.controls button{padding:10px;font-size:23px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.sequence{min-height:54px;padding:12px;border:2px dashed #cfa95e;border-radius:12px;max-width:600px;margin:12px auto;font-size:27px;word-break:break-word}.choice{display:block;width:min(100%,620px);margin:10px auto;background:#d8e9db;box-shadow:0 4px 0 #7c9d90;text-align:left}.choice.selected{background:#ffe087;outline:3px solid white}.cardrow{display:grid;gap:10px;max-width:700px;margin:auto}.storycard{width:100%;text-align:left;background:#d6e4e2;box-shadow:0 4px 0 #7c9d90}.storycard.selected{background:#ffe087}.badge{display:inline-block;background:#264f59;border:1px solid #b9a265;border-radius:30px;padding:6px 12px;margin:5px}.stars{font-size:38px;letter-spacing:6px}.hint{font-size:14px;color:#e8dfc8}.toast{margin:12px auto;padding:12px;border-radius:10px;background:#315b65;max-width:650px}.chests{font-size:42px;letter-spacing:15px}.medal{font-size:90px;animation:float 2s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-12px)}}.island{background:linear-gradient(#28485e,#33727a);border-radius:18px;padding:12px;margin:10px auto;max-width:650px}.foot{text-align:center;font-size:12px;color:#bbd0c9;margin:18px}.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.leveltag{color:#f4d59a;font-size:14px;letter-spacing:2px;text-transform:uppercase}.confetti{font-size:30px;animation:twinkle 1.5s infinite alternate}@media(max-width:500px){.panel{padding:14px}.app{padding:10px 8px 30px}button{font-size:15px}.controls{grid-template-columns:repeat(3,60px)}.cell{font-size:clamp(13px,4.2vw,24px)}}
</style></head><body><main id="app" class="app"></main><script>
(()=>{'use strict';const KEY='equipo-peter-pan-v1',app=document.getElementById('app');let state={mission:0,lives:3},message='',seq=[],selected=[],qIndex=0,answer=null,patternIndex=0,maze=null,busy=false;const arrows=['↑','↓','←','→'],delta={'↑':[-1,0],'↓':[1,0],'←':[0,-1],'→':[0,1]};let audio;function sound(kind){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(kind==='bad'?230:kind==='win'?640:470,t);o.frequency.exponentialRampToValueAtTime(kind==='bad'?130:kind==='win'?1000:680,t+.18);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.25)}catch(e){}}function save(){try{localStorage.setItem(KEY,JSON.stringify({mission:state.mission,lives:state.lives}))}catch(e){}}function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Number.isInteger(v.mission)&&v.mission>=0&&v.mission<=8&&v.lives>=1&&v.lives<=3)state=v}catch(e){}}function reset(){state={mission:1,lives:3};message='';seq=[];selected=[];qIndex=0;patternIndex=0;answer=null;maze=null;busy=false;save();render()}function lose(txt='¡Intentá nuevamente!'){if(busy)return;sound('bad');state.lives--;if(state.lives<=0){state.mission=8;state.lives=0;message='¡Se terminó la magia! Volvé a intentarlo.'}else message=txt+' Perdiste una estrella.';save();render()}function advance(){sound('win');state.mission++;message='';seq=[];selected=[];qIndex=0;patternIndex=0;answer=null;maze=null;busy=false;save();render()}function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b}function el(tag,txt,cls){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}function add(parent,...children){children.forEach(x=>parent.append(x));return parent}function base(title,desc){app.replaceChildren();const top=el('div',undefined,'top');add(top,el('span','MISIÓN '+state.mission+' DE 6','leveltag'),el('span','✦'.repeat(state.lives)+'☆'.repeat(3-state.lives),'hearts'));app.append(top);let panel=el('section',undefined,'panel');add(panel,el('h2',title),el('p',desc));app.append(panel);if(message)panel.append(el('div',message,'toast'));return panel}function actions(p,...bs){add(p,add(el('div',undefined,'actions'),...bs))}function start(){app.replaceChildren();const p=el('section',undefined,'panel hero');add(p,el('div','🌙 ✨ 🧚 🏝️ 🏴‍☠️','scene'),el('h1','EL EQUIPO DE PETER PAN'),el('p','JUEGO CREADO POR LOS ESTUDIANTES DE 4TO DEL INSTITUTO MODELO PAULA ALBARRACÍN'));p.append(btn('CLICK ACÁ PARA INICIAR LA AVENTURA',reset));if(state.mission>0&&state.mission<7)p.append(btn('CONTINUAR PARTIDA · MISIÓN '+state.mission,()=>{message='';render()},'secondary'));app.append(p)}
const map1=['........','..##....','...#....','........','.#...#..','........','...##...','........'];const route1=['→','→','↓','↓','↓','→','→','↓','↓','→','→','↓','→'];function mission1(){const p=base('VOLAMOS HACIA NUNCA JAMÁS','Programá el vuelo desde 🌟 hasta 🏝️. Elegí flechas y presioná COMPROBAR. ¡Evitá las nubes oscuras!');const board=el('div',undefined,'board');board.style.gridTemplateColumns='repeat(8,1fr)';let r=0,c=0;for(const s of seq){const d=delta[s];r+=d[0];c+=d[1]}map1.forEach((line,i)=>[...line].forEach((v,j)=>{const cell=el('div',i===r&&j===c?'🧚':i===7&&j===7?'🏝️':i===0&&j===0?'🌟':v==='#'?'☁️':'','cell '+(v==='#'?'wall':'path')+(i===r&&j===c?' player':''));board.append(cell)}));p.append(board);p.append(el('div',seq.join(' ')||'Tu secuencia aparecerá acá','sequence'));const buttons=el('div',undefined,'actions');arrows.forEach(a=>buttons.append(btn(a,()=>{if(seq.length<30){seq.push(a);message='';render()}})));p.append(buttons);actions(p,btn('BORRAR ÚLTIMA',()=>{seq.pop();render()},'secondary'),btn('REINICIAR FLECHAS',()=>{seq=[];render()},'secondary'),btn('COMPROBAR',()=>{let rr=0,cc=0,valid=true;for(const a of seq){rr+=delta[a][0];cc+=delta[a][1];if(rr<0||cc<0||rr>7||cc>7||map1[rr][cc]==='#'){valid=false;break}}if(valid&&rr===7&&cc===7){message='¡Llegaste a Nunca Jamás!';advance()}else lose('El recorrido no llega a la isla o atraviesa una nube.')}));p.append(el('p','Pista: necesitás 7 pasos hacia abajo y 7 hacia la derecha, sin pasar por las nubes.','hint'))}
const maps={2:['#########','#S..#...#','#.#...#.#','#...#...#','##.#..#.#','#...#...#','#.#...#.#','#......G#','#########'],6:['#########','#S..#...#','#.#...#.#','#...#...#','##.#..#.#','#...#...#','#.#...#.#','#......G#','#########']};const coinPositions=['1,2','2,3','3,2','5,3','7,5'];function initMaze(n){let map=maps[n];maze={n,map,r:1,c:1,coins:[],moves:0};if(n===2){let available=['1,2','3,1','3,3','5,2','7,5'];maze.coins=available}}function move(dir){if(!maze||busy)return;const [dr,dc]=delta[dir],r=maze.r+dr,c=maze.c+dc,cell=maze.map[r]?.[c];if(!cell||cell==='#'){lose('¡Cuidado! Hay un obstáculo.');return}maze.r=r;maze.c=c;maze.moves++;if(maze.n===2){let k=r+','+c;if(maze.coins.includes(k)){maze.coins=maze.coins.filter(x=>x!==k);sound('good')}}if(cell==='G'){if(maze.n===2&&maze.coins.length){message='¡Antes de recuperar la sombra, juntá las '+maze.coins.length+' monedas que faltan!';render();return}advance();return}message='';render()}function mazeMission(n){if(!maze||maze.n!==n)initMaze(n);const p=base(n===2?'ENCONTRAMOS LA SOMBRA':'ESCAPAMOS DEL BARCO PIRATA',n===2?'Recorré la habitación, juntá las 5 monedas 🪙 y encontrá la sombra 👤. ¡No choques con los muebles!':'Ayudá a Peter Pan a encontrar la salida 🚪 del barco. Usá las flechas para evitar los barriles.');if(n===2)p.append(el('div','MONEDAS: '+(5-maze.coins.length)+' / 5','badge'));const board=el('div',undefined,'board');board.style.gridTemplateColumns='repeat(9,1fr)';maze.map.forEach((line,i)=>[...line].forEach((v,j)=>{let isPlayer=i===maze.r&&j===maze.c;let coin=maze.coins.includes(i+','+j);const cell=el('div',isPlayer?'🧒':coin?'🪙':v==='#'?(n===2?'🪑':'🛢️'):v==='G'?(n===2?'👤':'🚪'):'','cell '+(v==='#'?'wall':'path')+(isPlayer?' player':coin?' coin':v==='G'?' goal':''));board.append(cell)}));p.append(board);const controls=el('div',undefined,'controls');[['↑','up'],['←','left'],['↓','down'],['→','right']].forEach(([a,cl])=>{const b=btn(a,()=>move(a));b.className=cl;controls.append(b)});p.append(controls);p.append(el('p','También podés jugar con las flechas del teclado. Cada choque con un obstáculo cuesta una estrella.','hint'))}
const stories=['Peter Pan llega a la habitación de Wendy.','Wendy y sus hermanos vuelan hacia Nunca Jamás.','Los niños viven aventuras en la isla.','Peter Pan se enfrenta al Capitán Garfio.'];const order=[2,0,3,1];function mission3(){const p=base('ORDENAMOS LA HISTORIA','Tocá las tarjetas en el orden en que suceden los hechos. También podés deshacer la última selección.');const row=el('div',undefined,'cardrow');order.forEach((id)=>{const b=btn((selected.includes(id)?'✓ ':'')+stories[id],()=>{if(!selected.includes(id)){selected.push(id);message='';render()}} ,'storycard'+(selected.includes(id)?' selected':''));row.append(b)});p.append(row);p.append(el('div',selected.map((id,i)=>(i+1)+'. '+stories[id]).join('  |  ')||'Seleccioná el primer acontecimiento','sequence'));actions(p,btn('DESHACER',()=>{selected.pop();render()},'secondary'),btn('BORRAR',()=>{selected=[];render()},'secondary'),btn('COMPROBAR',()=>{if(selected.length!==4){message='Elegí las cuatro tarjetas.';render();return}selected.every((v,i)=>v===i)?advance():lose('El orden de la historia no es correcto.')}))}
const questions=[{q:'¿Cómo se llega al País de Nunca Jamás?',opts:['La segunda a la derecha y todo recto hasta la mañana','A la vuelta de la esquina','Todo recto hasta ver una estrella roja'],ok:0},{q:'¿Por qué Peter Pan nunca volvió a su casa?',opts:['Porque no quería','Porque su mamá lo olvidó','Campanita le cerró la puerta'],ok:1},{q:'¿Qué personaje acompaña a Peter Pan y tiene polvo mágico?',opts:['Campanita','El cocodrilo','El pirata'],ok:0}];function mission4(){const p=base('EL DESAFÍO DEL CAPITÁN GARFIO','Respondé las preguntas para abrir los tres cofres del barco pirata.');p.append(el('div',Array.from({length:3},(_,i)=>i<qIndex?'🔓':'🧰').join('  '),'chests'));p.append(el('h2','COFRE '+(qIndex+1)));p.append(el('p',questions[qIndex].q));questions[qIndex].opts.forEach((opt,i)=>p.append(btn(opt,()=>{answer=i;render()},'choice'+(answer===i?' selected':''))));actions(p,btn('ABRIR COFRE',()=>{if(answer===null){message='Elegí una respuesta.';render();return}if(answer===questions[qIndex].ok){sound('good');qIndex++;answer=null;if(qIndex===3)advance();else{message='¡Cofre abierto!';render()}}else{answer=null;lose('Esa no es la respuesta correcta.')}}))}
const patterns=[{s:['🔴','🔵','🔴','🔵'],o:['🔴','🟢','🔵'],a:0},{s:['⭐','🌙','🌙','⭐','🌙','🌙'],o:['🌙','⭐','☀️'],a:1},{s:['🟢','🟡','🔵','🟢','🟡','🔵'],o:['🟢','🔵','🟡'],a:0},{s:['❤️','💜','❤️','💜','❤️'],o:['💜','💚','❤️'],a:0},{s:['🌟','🌟','🌙','🌟','🌟','🌙'],o:['🌟','🌙','☀️'],a:0}];function mission5(){const p=base('EL CÓDIGO SECRETO DE CAMPANITA','Completá los cinco patrones para encender las estrellas mágicas.');p.append(el('div','⭐'.repeat(patternIndex)+'☆'.repeat(5-patternIndex),'stars'));p.append(el('h2','PATRÓN '+(patternIndex+1)+' DE 5'));const pat=patterns[patternIndex];p.append(el('div',pat.s.join(' ')+'  ❓','sequence'));p.append(el('p','¿Qué símbolo sigue?'));const row=el('div',undefined,'actions');pat.o.forEach((v,i)=>row.append(btn(v,()=>{answer=i;render()},answer===i?'secondary':'')));p.append(row);actions(p,btn('COMPROBAR',()=>{if(answer===null){message='Elegí un símbolo.';render();return}if(answer===pat.a){sound('good');patternIndex++;answer=null;if(patternIndex===5)advance();else{message='¡Una estrella más!';render()}}else{answer=null;lose('Revisá qué parte del patrón se repite.')}}))}
function end(){app.replaceChildren();const p=el('section',undefined,'panel hero');if(state.mission===8){add(p,el('div','🌑','scene'),el('h1','¡SE TERMINÓ LA MAGIA!'),el('p','Perdiste las tres estrellas. Podés volver a empezar la aventura.'));p.append(btn('VOLVER A INTENTARLO',reset))}else{add(p,el('div','🎆 ✨ 🎉 ✨ 🎆','confetti'),el('h1','¡FELICITACIONES!'),el('p','¡Lograste completar todas las aventuras de Nunca Jamás! Gracias a tu ingenio, tus conocimientos y tu valentía, Peter Pan y los compañeros de 4to pudieron superar todos los desafíos.'),el('div','🏅','medal'),el('h2','CUARTO GRADO TE REGALA UNA MEDALLA DE EXPLORADOR DE NUNCA JAMÁS'));actions(p,btn('VOLVER A JUGAR',reset),btn('INICIO',()=>{state={mission:0,lives:3};save();render()},'secondary'))}app.append(p)}function render(){if(state.mission===0)return start();if(state.mission===7||state.mission===8)return end();if(state.mission===1)return mission1();if(state.mission===2||state.mission===6)return mazeMission(state.mission);if(state.mission===3)return mission3();if(state.mission===4)return mission4();if(state.mission===5)return mission5()}document.addEventListener('keydown',e=>{if(state.mission!==2&&state.mission!==6)return;const m={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};if(m[e.key]){e.preventDefault();move(m[e.key])}});load();render();})();
</script></body></html>
